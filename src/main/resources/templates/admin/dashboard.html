<!DOCTYPE html>
<html th:replace="~{layout :: layout('Admin Dashboard', ~{::div.content})}">
<body>
<div class="content">

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon primary"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="stat-value" th:text="${totalUsers}">0</div>
            <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon purple"><i class="fa-solid fa-bullseye"></i></div>
            </div>
            <div class="stat-value" th:text="${totalGoals}">0</div>
            <div class="stat-label">System Goals</div>
        </div>
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon success"><i class="fa-solid fa-calendar-check"></i></div>
            </div>
            <div class="stat-value" th:text="${dashData.completedCheckins} + ' / ' + ${dashData.totalEmployees}">0</div>
            <div class="stat-label" th:text="${currentQuarter} + ' Check-ins Completed'">Q1 Check-ins</div>
        </div>
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon warning"><i class="fa-solid fa-clock-rotate-left"></i></div>
            </div>
            <div class="stat-value" th:text="${recentAuditLogs.size()}">0</div>
            <div class="stat-label">Recent Audit Events</div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Goal Status Overview</h3>
            </div>
            <div class="card-body chart-container">
                <canvas id="adminStatusChart"></canvas>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">System Status & Config</h3>
            </div>
            <div class="card-body">
                <h4 class="text-sm font-bold mb-2">Active Goal Cycle</h4>
                <div th:if="${activeCycle != null}" class="p-3 bg-gray-50 border rounded mb-4" style="background:var(--success-light); border:1px solid #6EE7B7; border-radius:var(--radius-sm);">
                    <div class="d-flex align-center gap-2">
                        <i class="fa-solid fa-circle-check text-success"></i>
                        <span class="font-bold text-success" th:text="${activeCycle.cycleName}">FY 2025</span>
                    </div>
                    <div class="text-xs mt-1" style="color:#065F46;" th:text="'Phase: ' + ${activeCycle.phase}">Phase</div>
                    <div class="text-xs mt-1" style="color:#065F46;" th:text="'Window: ' + ${#temporals.format(activeCycle.windowOpen, 'dd MMM')} + ' to ' + ${#temporals.format(activeCycle.windowClose, 'dd MMM yyyy')}">Window</div>
                </div>
                <div th:if="${activeCycle == null}" class="alert alert-danger mb-4">
                    <i class="fa-solid fa-triangle-exclamation mt-1"></i> No active cycle found. <br>System is locked for employees.
                </div>
                
                <h4 class="text-sm font-bold mb-2">Quick Actions</h4>
                <div class="d-flex" style="flex-direction:column; gap:10px;">
                    <a th:href="@{/admin/cycles}" class="btn btn-outline w-100 justify-between">
                        <span><i class="fa-solid fa-calendar-days mr-2"></i> Manage Cycles</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <a th:href="@{/admin/users}" class="btn btn-outline w-100 justify-between">
                        <span><i class="fa-solid fa-users-gear mr-2"></i> Manage Users</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <a th:href="@{/admin/reports}" class="btn btn-outline w-100 justify-between">
                        <span><i class="fa-solid fa-file-excel mr-2"></i> Export Data</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', () => {
            const statusDist = /*[[${dashData.goalStatusDistribution}]]*/ {};
            
            const labels = [];
            const data = [];
            const colors = [];
            
            const colorMap = {
                'APPROVED': '#10B981',
                'SUBMITTED': '#F59E0B',
                'DRAFT': '#9CA3AF',
                'REWORK': '#EF4444',
                'LOCKED': '#4F46E5'
            };
            
            for(const [status, count] of Object.entries(statusDist)) {
                labels.push(status);
                data.push(count);
                colors.push(colorMap[status] || '#CBD5E1');
            }
            
            if(data.length > 0) {
                createDoughnutChart('adminStatusChart', labels, data, colors);
            }
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
