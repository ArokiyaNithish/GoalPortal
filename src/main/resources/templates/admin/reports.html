<!DOCTYPE html>
<html th:replace="~{layout :: layout('System Reports', ~{::div.content})}">
<body>
<div class="content">

    <div class="card mb-6" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header">
            <h3 class="card-title">Export Achievement Report</h3>
        </div>
        
        <div class="card-body">
            <div class="alert alert-info">
                <i class="fa-solid fa-circle-info mt-1"></i>
                <div>
                    Generate a comprehensive Excel report containing all employee goals, planned targets, actual achievements, and computed progress scores for a specific quarter.
                </div>
            </div>

            <form th:action="@{/admin/reports/export}" method="get" class="mt-4" style="background:var(--bg-secondary); padding:24px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                
                <div class="form-grid">
                    <div class="form-group mb-0">
                        <label class="form-label">Select Quarter</label>
                        <select name="quarter" class="form-select">
                            <option th:each="q : ${quarters}" th:value="${q}" th:text="${q}" th:selected="${q == currentQuarter}"></option>
                        </select>
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label">Cycle Year</label>
                        <input type="number" name="year" class="form-control" th:value="${currentYear}">
                    </div>
                </div>

                <div class="d-flex justify-end mt-4 pt-4" style="border-top:1px solid var(--border);">
                    <button type="submit" class="btn btn-success"><i class="fa-solid fa-file-excel"></i> Download Excel Report</button>
                </div>
            </form>
            
        </div>
    </div>
    
    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header">
            <h3 class="card-title">Completion Rate by Department</h3>
            <div class="badge badge-primary" th:text="${currentQuarter} + ' Check-ins'">Q1</div>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                    <tr>
                        <th>Department</th>
                        <th>Total Employees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dept : ${dashData.byDepartment}">
                        <td class="font-bold" th:text="${dept.key}">Dept</td>
                        <td th:text="${dept.value}">0</td>
                    </tr>
                    <tr th:if="${dashData.byDepartment.isEmpty()}">
                        <td colspan="2" class="text-center text-muted">No department data available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
