<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AtomQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--primary-light) 100%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: var(--shadow-lg); width: 100%; max-width: 500px;
            text-align: center;
        }
        .login-logo { margin-bottom: 24px; }
        .login-logo i { font-size: 48px; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; color: transparent; }
        .login-title { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .login-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
        .login-form { text-align: left; }
        .login-btn { width: 100%; justify-content: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card" style="margin: 40px 0;">
    <div class="login-logo"><i class="fa-solid fa-bullseye"></i></div>
    <div class="login-title">Create Account</div>
    <div class="login-sub">Join the AtomQuest Goal Portal</div>

    <div th:if="${error}" class="alert alert-danger" style="text-align: left;">
        <i class="fa-solid fa-circle-exclamation mt-1"></i> <span th:text="${error}"></span>
    </div>

    <form class="login-form" th:action="@{/register}" method="post">
        <div class="form-group">
            <label class="form-label">Full Name <span class="required">*</span></label>
            <input type="text" name="name" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="name@atomquest.com" required>
        </div>
        <div class="form-group">
            <label class="form-label">Password <span class="required">*</span></label>
            <input type="password" name="password" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Role <span class="required">*</span></label>
            <select name="role" class="form-select" required id="roleSelect">
                <option value="EMPLOYEE">Employee</option>
                <option value="MANAGER">Manager</option>
            </select>
        </div>

        <div class="form-group" id="managerSelectGroup">
            <label class="form-label">Reporting Manager</label>
            <select name="managerId" class="form-select">
                <option value="">-- Select Manager (Optional) --</option>
                <option th:each="m : ${managers}" th:value="${m.id}" th:text="${m.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary login-btn btn-lg">Continue <i class="fa-solid fa-arrow-right ml-2"></i></button>
    </form>

    <div style="margin-top: 24px; font-size: 14px;">
        Already have an account? <a th:href="@{/login}" style="color: var(--primary); font-weight: bold; text-decoration: none;">Sign In</a>
    </div>
</div>

<script>
    document.getElementById('roleSelect').addEventListener('change', function() {
        // You could hide manager selection if they register as MANAGER themselves,
        // but often managers also have managers. Let's just leave it visible.
    });
</script>

</body>
</html>
